# Arsenal: mod de armas para Horizon (docs/native-mods.md "Trait mods" + inyecciones de horizon-mixins).
# Compilar: tools/dev_build.sh (o horizon-launcher native-build <esta carpeta> --trust-native-code)
[mod]
id = "arsenal_core"
version = "0.2.1"

# Commit de Horizon con el que está probado (Nightly 2026-11-08). Las inyecciones de abajo apuntan
# a funciones concretas del motor, así que el mod queda atado a este commit: el launcher compila
# sobre él aunque el jugador tenga otra versión.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[api]
path = "api"

# Estado y cálculos compartidos entre el crate `api` y las inyecciones: horizon_client::arsenal_rig.
# rig.rs lo genera tools/gen_content.py (plantilla tools/rig_template.rs + tabla de agarres).
[[module]]
id = "rig"
file = "crates/horizon-client/src/client_lib.rs"
name = "arsenal_rig"
source = "rig.rs"
visibility = "pub"

# Primera persona: los dos brazos sobre el arma. Ningún hook dibuja brazos, y hand_geometry no
# admite inyecciones (tiene `use` internos); item_activation_geometry recibe la geometría de la
# mano recién hecha (&mut hand) justo después, en cada frame en que hay mano.
[[injection]]
id = "fp_arms"
target = "horizon_client::game::totem::Game<'_>::item_activation_geometry"
kind = "HEAD"
helper = "fp_arms.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]

# Tercera persona: pose de arco a dos manos. La pose de brazos se elige por id de ítem fijo
# (arco, ballesta) dentro de vanilla_setup, que tiene macros; anim::setup la envuelve y se
# corrige al volver.
[[injection]]
id = "tp_arms"
target = "horizon_client_lib::mobs::anim::setup"
kind = "RETURN"
helper = "tp_arms.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "m", ty = "&Mob", value = "m" },
  { name = "p", ty = "&mut Poses", value = "&mut *p" },
]
