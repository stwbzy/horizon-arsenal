# Arsenal: mod de armas para Horizon (trait mod, docs/native-mods.md "Trait mods").
# Compilar: horizon-launcher native-build <esta carpeta> --instance arsenal-dev --trust-native-code
[mod]
id = "arsenal"
version = "0.1.0"

# Commit de Horizon con el que está probado (Nightly 2026-11-08). Un .hnmod debe declararlo igual
# en horizon-native.json. Sólo usamos hooks del catálogo + Host, así que suele compilar también
# en Nightlies más nuevas.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[api]
path = "api"
